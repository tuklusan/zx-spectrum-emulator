name: One-time release tag

on:
  workflow_run:
    workflows: ["Deploy emulator demo to GitHub Pages"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  tag:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: SANYALnet-Labs-2.0.0-RELEASE
      RELEASE_SHA: 20b4ae5e3339ec70a79a5cbd3bed46571ec02f0f
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Make sure no other runner is active
        shell: bash
        run: |
          set -euo pipefail
          active="$(
            curl -fsSL               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" |
            jq --argjson self "$GITHUB_RUN_ID"               '[.workflow_runs[] | select(.id != $self and (.status == "queued" or .status == "in_progress"))] | length'
          )"
          test "$active" -eq 0

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git tag "$RELEASE_TAG" "$RELEASE_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

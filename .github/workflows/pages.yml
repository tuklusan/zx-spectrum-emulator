name: Deploy emulator demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run fast tests
        run: npm test

      - name: Build static demo
        run: npm run build:pages

      - name: Verify Pages SEO output
        run: node scripts/verify-pages-seo.js

      - name: Check production media relay
        run: node scripts/check-media-relay.js

      - name: Run Spectrum browser regressions
        run: node scripts/browser-regression.js

      - name: Upload Spectrum browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spectrum-browser-regression
          path: browser-regression-artifacts
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
